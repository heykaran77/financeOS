<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%">
  <defs>
    <style>
      .bg { fill: #09090B; }
      .grid-line { stroke: #27272A; stroke-width: 0.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #FFFFFF; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #A1A1AA; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .card-bg { fill: #18181B; }
      .card-stroke { stroke: #27272A; stroke-width: 1; }
      .accent-green { fill: #10B981; }
      .accent-green-text { fill: #34D399; }
      .blur-glow { filter: blur(60px); }
    </style>
    
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" class="bg" />
  
  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="150" fill="url(#glow-grad)" class="blur-glow" />
  <circle cx="1000" cy="450" r="200" fill="url(#glow-grad)" class="blur-glow" />
  
  <rect width="1200" height="600" fill="url(#grid)" />

  <!-- Left Side: Copy -->
  <g transform="translate(100, 210)">
    <!-- Badge -->
    <g transform="translate(0, -60)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#18181B" class="card-stroke" />
      <circle cx="16" cy="14" r="4" class="accent-green" />
      <text x="28" y="19" class="text-mono" font-size="12" fill="#A1A1AA" font-weight="500">v0.1.0-alpha</text>
    </g>

    <!-- Title -->
    <text x="0" y="20" class="text-title" font-size="72" letter-spacing="-2">Finance OS</text>
    
    <!-- Subtitle -->
    <text x="0" y="70" class="text-subtitle" font-size="24">A self-built, full-stack</text>
    <text x="0" y="104" class="text-subtitle" font-size="24">personal finance workspace.</text>
    
    <!-- CTA Button -->
    <rect x="0" y="150" width="160" height="48" rx="24" fill="#FAFAFA" />
    <text x="80" y="179" class="text-title" font-size="16" fill="#09090B" text-anchor="middle">View Ledger</text>
  </g>

  <!-- Right Side: Interface Mockup -->
  <g transform="translate(560, 90)">
    <!-- Main Window -->
    <rect x="0" y="0" width="560" height="420" rx="12" class="card-bg card-stroke" />
    
    <!-- Window Header -->
    <path d="M 0 12 Q 0 0 12 0 L 548 0 Q 560 0 560 12 L 560 48 L 0 48 Z" fill="#09090B" />
    <circle cx="24" cy="24" r="6" fill="#3F3F46" />
    <circle cx="44" cy="24" r="6" fill="#3F3F46" />
    <circle cx="64" cy="24" r="6" fill="#3F3F46" />
    
    <line x1="0" y1="48" x2="560" y2="48" class="card-stroke" />

    <!-- Navigation Tabs -->
    <g transform="translate(24, 72)">
      <rect x="0" y="0" width="80" height="32" rx="16" fill="#27272A" />
      <text x="40" y="21" class="text-title" font-size="13" fill="#FAFAFA" text-anchor="middle">Overview</text>
      
      <text x="124" y="21" class="text-title" font-size="13" fill="#A1A1AA" text-anchor="middle">Ledger</text>
      <text x="194" y="21" class="text-title" font-size="13" fill="#A1A1AA" text-anchor="middle">Budgets</text>
    </g>

    <!-- Content Area -->
    <g transform="translate(24, 128)">
      <!-- Net Worth Card -->
      <rect x="0" y="0" width="244" height="120" rx="12" fill="#09090B" class="card-stroke" />
      <text x="20" y="32" class="text-subtitle" font-size="14">Total Net Worth</text>
      <text x="20" y="70" class="text-mono" font-size="28" fill="#FAFAFA" font-weight="600">₹ 24,50,000</text>
      <rect x="20" y="86" width="60" height="20" rx="10" fill="#10B981" fill-opacity="0.1" />
      <text x="50" y="100" class="text-mono accent-green-text" font-size="11" text-anchor="middle" font-weight="600">+2.4%</text>

      <!-- Cash Flow Card -->
      <rect x="268" y="0" width="244" height="120" rx="12" fill="#09090B" class="card-stroke" />
      <text x="288" y="32" class="text-subtitle" font-size="14">Monthly Cash Flow</text>
      
      <!-- Mini Chart -->
      <g transform="translate(288, 54)">
        <rect x="0" y="20" width="12" height="30" rx="2" fill="#3F3F46" />
        <rect x="20" y="35" width="12" height="15" rx="2" fill="#3F3F46" />
        <rect x="40" y="10" width="12" height="40" rx="2" fill="#3F3F46" />
        <rect x="60" y="25" width="12" height="25" rx="2" fill="#3F3F46" />
        <rect x="80" y="15" width="12" height="35" rx="2" class="accent-green" />
      </g>
      
      <text x="396" y="70" class="text-mono" font-size="22" fill="#FAFAFA" font-weight="600">₹ 45,200</text>
      <text x="396" y="94" class="text-mono" font-size="12" fill="#A1A1AA">Expenses</text>
      
      <!-- Transactions Area -->
      <rect x="0" y="144" width="512" height="124" rx="12" fill="#09090B" class="card-stroke" />
      <text x="20" y="176" class="text-subtitle" font-size="14">Recent Activity</text>
      
      <!-- Transaction 1 -->
      <g transform="translate(20, 196)">
        <rect x="0" y="0" width="36" height="36" rx="18" fill="#18181B" class="card-stroke" />
        <circle cx="18" cy="18" r="5" fill="#FAFAFA" />
        <text x="52" y="16" class="text-title" font-size="14" fill="#FAFAFA">Apple Store</text>
        <text x="52" y="32" class="text-subtitle" font-size="12">Electronics</text>
        <text x="472" y="24" class="text-mono" font-size="14" fill="#FAFAFA" text-anchor="end" font-weight="500">- ₹ 12,400</text>
      </g>
      
      <line x1="20" y1="244" x2="492" y2="244" class="card-stroke" />

      <!-- Transaction 2 -->
      <g transform="translate(20, 256)">
        <rect x="0" y="0" width="36" height="36" rx="18" fill="#18181B" class="card-stroke" />
        <circle cx="18" cy="18" r="5" class="accent-green" />
        <text x="52" y="16" class="text-title" font-size="14" fill="#FAFAFA">Salary Deposit</text>
        <text x="52" y="32" class="text-subtitle" font-size="12">Income</text>
        <text x="472" y="24" class="text-mono accent-green-text" font-size="14" text-anchor="end" font-weight="500">+ ₹ 1,20,000</text>
      </g>
    </g>
  </g>
</svg>
